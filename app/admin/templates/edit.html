{% extends "layout.html" %}
{% block title %}{{ '编辑记录' if version else '新增记录' }}{% endblock %}
{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px;">{{ '编辑记录 #' ~ version.id if version else '新增记录' }}</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>版本号 *</label>
            <input type="text" name="version" value="{{ version.version if version else '' }}" required placeholder="例如: 20.6">
        </div>
        <div class="form-group">
            <label>下载地址 *</label>
            <input type="text" name="download_url" value="{{ version.download_url if version else '' }}" required placeholder="https://...">
        </div>
        <div class="form-group">
            <label>文件名</label>
            <input type="text" name="filename" value="{{ version.filename if version and version.filename else '' }}" placeholder="例如: IDM_6.4x_Crack_v20.6.zip">
        </div>
        <div class="form-group">
            <label>文件大小</label>
            <input type="text" name="filesize" value="{{ version.filesize if version and version.filesize else '' }}" placeholder="例如: 65850 (Byte)">
        </div>
        <div class="form-group">
            <label>SHA256</label>
            <input type="text" name="sha256" value="{{ version.sha256 if version and version.sha256 else '' }}" placeholder="SHA256 哈希值">
        </div>
        <div class="form-group">
            <label>直连地址</label>
            <input type="text" name="direct_url" value="{{ version.direct_url if version and version.direct_url else '' }}" placeholder="文件直连下载地址">
        </div>
        <div class="form-group">
            <label>更新日志</label>
            <textarea id="changelogText" name="changelog" rows="8" placeholder="Changelog 内容" style="width:100%; font-family: monospace; font-size: 13px;">{{ version.changelog if version and version.changelog else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>更新日志中文翻译</label>
            <textarea id="changelogZhText" name="changelog_zh" rows="8" placeholder="自动翻译后的中文更新日志" style="width:100%; font-family: monospace; font-size: 13px;">{{ version.changelog_zh if version and version.changelog_zh else '' }}</textarea>
            <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
                <button type="button" class="btn btn-secondary" onclick="translateChangelog()">翻译更新日志</button>
                <span id="translateStatus" style="color:#777; font-size:13px;"></span>
            </div>
        </div>
        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">{{ '保存修改' if version else '新增' }}</button>
            <a href="{{ url_for('admin.dashboard') }}" class="btn" style="background: #6c757d;">返回</a>
        </div>
    </form>
</div>
<script>
function translateChangelog() {
    var sourceEl = document.getElementById('changelogText');
    var targetEl = document.getElementById('changelogZhText');
    var statusEl = document.getElementById('translateStatus');
    var text = sourceEl.value.trim();
    if (!text) {
        alert('更新日志不能为空');
        return;
    }
    if (targetEl.value.trim() && !confirm('中文翻译已有内容，确定覆盖？')) {
        return;
    }
    statusEl.textContent = '正在翻译...';
    fetch('/admin/api/translation-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
    })
        .then(r => r.json())
        .then(data => {
            if (data.code !== 0) {
                statusEl.textContent = data.message || '翻译失败';
                return;
            }
            targetEl.value = data.data.translation || '';
            statusEl.textContent = '翻译完成，保存后生效';
        })
        .catch(() => {
            statusEl.textContent = '请求失败';
        });
}
</script>
{% endblock %}
